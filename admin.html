<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Location</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 2rem; background: #f9f9f9; }
    button { padding: 1rem 2rem; font-size: 1.2rem; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #status { margin-top: 1.5rem; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h2>Update Technician Location</h2>
  <button onclick="sendLocation()">Update My Location</button>
  <p id="status"></p>

  <script>
    const FIREBASE_URL = "https://tuckertotalrvtechlocator-default-rtdb.firebaseio.com/location.json";

    function sendLocation() {
      const status = document.getElementById("status");
      if (!navigator.geolocation) {
        status.innerText = "Geolocation not supported by browser.";
        return;
      }

      status.innerText = "Acquiring GPS coordinates...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          status.innerText = "Finding nearest major city...";

          try {
            // Zoom=8 forces Nominatim to pull broader metro/city areas (e.g. Joliet/Shorewood)
            const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=8`);
            const geoData = await geoRes.json();
            
            const addr = geoData.address || {};
            
            // Prioritize major city or town, avoiding minor local townships
            let majorCity = addr.city || addr.town || addr.municipality;

            // Fallback: If in an unincorporated area, query BigDataCloud for the nearest principal administrative city
            if (!majorCity) {
              const fallbackRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
              const fallbackData = await fallbackRes.json();
              majorCity = fallbackData.city || fallbackData.locality || addr.county || "Unknown Area";
            }

            // Strip township naming if present
            majorCity = majorCity.replace(/Township of /i, '').replace(/ Township/i, '');

            const state = addr.state_code ? `, ${addr.state_code.toUpperCase()}` : (addr.state ? `, ${addr.state}` : "");
            const locationString = `${majorCity}${state}`;

            status.innerText = `Updating database to: ${locationString}...`;

            const payload = {
              city: locationString,
              lat: lat,
              lon: lon,
              timestamp: new Date().toISOString()
            };

            const fbRes = await fetch(FIREBASE_URL, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (fbRes.ok) {
              status.innerText = `Success! Location set to: ${locationString}`;
            } else {
              status.innerText = `Firebase Error: ${fbRes.status} ${fbRes.statusText}`;
            }
          } catch (err) {
            status.innerText = "Error: " + err.message;
            console.error(err);
          }
        },
        (err) => { status.innerText = "GPS Permission Error: " + err.message; },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }
  </script>
</body>
</html>
