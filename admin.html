<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Location</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 2rem; background: #f9f9f9; }
    button { padding: 1rem 2rem; font-size: 1.2rem; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #status { margin-top: 1.5rem; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h2>Update Technician Location</h2>
  <button onclick="sendLocation()">Update My Location</button>
  <p id="status"></p>

  <script>
    const FIREBASE_URL = "https://tuckertotalrvtechlocator-default-rtdb.firebaseio.com/location.json";

    function sendLocation() {
      const status = document.getElementById("status");
      if (!navigator.geolocation) {
        status.innerText = "Geolocation not supported by browser.";
        return;
      }

      status.innerText = "Acquiring GPS coordinates...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          status.innerText = "Searching for nearest major city...";

          try {
            let nearestCity = "";
            let stateCode = "IL";

            // 1. Search OpenStreetMap specifically for places tagged as CITY near current coordinates
            const citySearchRes = await fetch(
              `https://nominatim.openstreetmap.org/search?format=json&q=city&bounded=1&viewbox=${lon-0.35},${lat+0.35},${lon+0.35},${lat-0.35}&limit=5`
            );
            const citySearchData = await citySearchRes.json();

            if (citySearchData && citySearchData.length > 0) {
              // Filter out entries containing township, village, or county
              const cityMatches = citySearchData.filter(item => {
                const name = item.display_name.toLowerCase();
                return !name.includes("township") && !name.includes("county") && !name.includes("village");
              });

              if (cityMatches.length > 0) {
                // Grab the primary city name (first part before the comma)
                nearestCity = cityMatches[0].display_name.split(',')[0].trim();
              }
            }

            // 2. Fallback: Reverse geocode with zoom=5 to pull regional city hub
            if (!nearestCity) {
              const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=5`);
              const geoData = await geoRes.json();
              const addr = geoData.address || {};

              nearestCity = addr.city || addr.town || "Joliet";
              if (addr.state_code) stateCode = addr.state_code.toUpperCase();
            }

            // Clean up any stray township or village labels
            nearestCity = nearestCity.replace(/Township of /i, '').replace(/ Township/i, '').replace(/ Village/i, '');

            const locationString = `${nearestCity}, ${stateCode}`;
            status.innerText = `Updating database to: ${locationString}...`;

            const payload = {
              city: locationString,
              lat: lat,
              lon: lon,
              timestamp: new Date().toISOString()
            };

            const fbRes = await fetch(FIREBASE_URL, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (fbRes.ok) {
              status.innerText = `Success! Location set to: ${locationString}`;
            } else {
              status.innerText = `Firebase Error: ${fbRes.status} ${fbRes.statusText}`;
            }
          } catch (err) {
            status.innerText = "Error: " + err.message;
            console.error(err);
          }
        },
        (err) => { status.innerText = "GPS Permission Error: " + err.message; },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }
  </script>
</body>
</html>
