<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Location</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 2rem; background: #f9f9f9; }
    button { padding: 1rem 2rem; font-size: 1.2rem; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #status { margin-top: 1.5rem; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h2>Update Technician Location</h2>
  <button onclick="sendLocation()">Update My Location</button>
  <p id="status"></p>

  <script>
    const FIREBASE_URL = "https://tuckertotalrvtechlocator-default-rtdb.firebaseio.com/location.json";

    function sendLocation() {
      const status = document.getElementById("status");
      if (!navigator.geolocation) {
        status.innerText = "Geolocation not supported by browser.";
        return;
      }

      status.innerText = "Acquiring GPS coordinates...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          status.innerText = "Finding nearest major city...";

          try {
            let cityName = "";
            let stateName = "IL";

            // 1. Query Overpass API for nearby incorporated city/village boundaries (radius ~15km)
            const query = `[out:json][timeout:10];
              (
                node["place"~"city|town"](around:15000,${lat},${lon});
                relation["boundary"="administrative"]["admin_level"="8"](around:15000,${lat},${lon});
              );
              out tags center;`;

            const overpassRes = await fetch("https://overpass-api.de/api/interpreter", {
              method: "POST",
              body: query
            });

            if (overpassRes.ok) {
              const data = await overpassRes.json();
              if (data.elements && data.elements.length > 0) {
                // Filter out any township entries
                const validPlaces = data.elements.filter(el => {
                  const name = (el.tags && el.tags.name) ? el.tags.name : "";
                  return name && !name.toLowerCase().includes("township");
                });

                if (validPlaces.length > 0) {
                  // Grab the closest matched incorporated city/village
                  cityName = validPlaces[0].tags.name;
                }
              }
            }

            // 2. Fallback to standard Nominatim if Overpass finds nothing
            if (!cityName) {
              const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`);
              const geoData = await geoRes.json();
              const addr = geoData.address || {};
              cityName = addr.city || addr.town || addr.village || addr.county || "Unknown Area";
              cityName = cityName.replace(/Township of /i, '').replace(/ Township/i, '');
              if (addr.state_code) stateName = addr.state_code.toUpperCase();
            }

            const locationString = `${cityName}, ${stateName}`;
            status.innerText = `Updating database to: ${locationString}...`;

            const payload = {
              city: locationString,
              lat: lat,
              lon: lon,
              timestamp: new Date().toISOString()
            };

            const fbRes = await fetch(FIREBASE_URL, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (fbRes.ok) {
              status.innerText = `Success! Location set to: ${locationString}`;
            } else {
              status.innerText = `Firebase Error: ${fbRes.status} ${fbRes.statusText}`;
            }
          } catch (err) {
            status.innerText = "Error: " + err.message;
            console.error(err);
          }
        },
        (err) => { status.innerText = "GPS Permission Error: " + err.message; },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }
  </script>
</body>
</html>
