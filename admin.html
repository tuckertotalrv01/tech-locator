<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Location</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 2rem; background: #f9f9f9; }
    button { padding: 1rem 2rem; font-size: 1.2rem; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #status { margin-top: 1.5rem; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h2>Update Technician Location</h2>
  <button onclick="sendLocation()">Update My Location</button>
  <p id="status"></p>

  <script>
    const FIREBASE_URL = "https://tuckertotalrvtechlocator-default-rtdb.firebaseio.com/location.json";

    function sendLocation() {
      const status = document.getElementById("status");
      if (!navigator.geolocation) {
        status.innerText = "Geolocation not supported by browser.";
        return;
      }

      status.innerText = "Acquiring GPS coordinates...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          status.innerText = "Finding nearest major city boundary...";

          try {
            let majorCity = "";
            let state = "";

            // 1. Query Overpass API for nearby city/town boundary
            const overpassQuery = `[out:json];is_in(${lat},${lon});area[boundary=administrative][admin_level~"8|7"]['name'];out;`;
            const overpassRes = await fetch("https://overpass-api.de/api/interpreter", {
              method: "POST",
              body: overpassQuery
            });

            if (overpassRes.ok) {
              const overpassData = await overpassRes.json();
              if (overpassData.elements && overpassData.elements.length > 0) {
                // Filter out entries containing "Township" to grab actual cities/villages
                const cities = overpassData.elements.filter(el => 
                  el.tags && el.tags.name && !el.tags.name.toLowerCase().includes("township")
                );
                if (cities.length > 0) {
                  majorCity = cities[0].tags.name;
                }
              }
            }

            // 2. Fallback to BigDataCloud if Overpass returns nothing
            const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
            const geoData = await geoRes.json();

            if (!majorCity) {
              majorCity = geoData.city || geoData.locality || "Unknown Location";
              // Clean up township prefix/suffix if present
              majorCity = majorCity.replace(/Township of /i, '').replace(/ Township/i, '');
            }

            state = geoData.principalSubdivisionCode ? `, ${geoData.principalSubdivisionCode.replace('US-', '')}` : "";
            const locationString = `${majorCity}${state}`;

            status.innerText = `Updating database to: ${locationString}...`;

            const payload = {
              city: locationString,
              lat: lat,
              lon: lon,
              timestamp: new Date().toISOString()
            };

            const fbRes = await fetch(FIREBASE_URL, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (fbRes.ok) {
              status.innerText = `Success! Location set to: ${locationString}`;
            } else {
              status.innerText = `Firebase Error: ${fbRes.status} ${fbRes.statusText}`;
            }
          } catch (err) {
            status.innerText = "Error: " + err.message;
            console.error(err);
          }
        },
        (err) => { status.innerText = "GPS Permission Error: " + err.message; },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }
  </script>
</body>
</html>
