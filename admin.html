<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Location</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 2rem; background: #f9f9f9; }
    button { padding: 1rem 2rem; font-size: 1.2rem; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #status { margin-top: 1.5rem; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h2>Update Technician Location</h2>
  <button onclick="sendLocation()">Update My Location</button>
  <p id="status"></p>

  <script>
    const FIREBASE_URL = "https://tuckertotalrvtechlocator-default-rtdb.firebaseio.com/location.json";

    // Haversine formula to calculate distance between two GPS points in miles
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 3958.8; // Radius of Earth in miles
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function sendLocation() {
      const status = document.getElementById("status");
      if (!navigator.geolocation) {
        status.innerText = "Geolocation not supported by browser.";
        return;
      }

      status.innerText = "Acquiring GPS coordinates...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          status.innerText = "Searching for nearest major city by population...";

          try {
            let cityName = "";
            let stateCode = "IL";

            // Query Overpass for places strictly tagged as 'city' or 'town' within ~35 miles (~55,000 meters)
            const overpassQuery = `[out:json][timeout:10];
              (
                node["place"="city"](around:55000,${lat},${lon});
                node["place"="town"](around:35000,${lat},${lon});
              );
              out tags center;`;

            const overpassRes = await fetch("https://overpass-api.de/api/interpreter", {
              method: "POST",
              body: overpassQuery
            });

            if (overpassRes.ok) {
              const data = await overpassRes.json();
              if (data.elements && data.elements.length > 0) {
                // Calculate distance to each matched city/town and sort by distance + population
                const places = data.elements.map(el => {
                  const pLat = el.lat || (el.center ? el.center.lat : 0);
                  const pLon = el.lon || (el.center ? el.center.lon : 0);
                  const distance = calculateDistance(lat, lon, pLat, pLon);
                  const pop = parseInt(el.tags.population || "0", 10);
                  const isMajorCity = el.tags.place === "city";
                  return {
                    name: el.tags.name,
                    distance: distance,
                    population: pop,
                    isCity: isMajorCity
                  };
                });

                // Filter out townships or non-city labels
                const validCities = places.filter(p => 
                  p.name && 
                  !p.name.toLowerCase().includes("township") && 
                  !p.name.toLowerCase().includes("county")
                );

                // Sort primarily by closest distance, prioritizing 'city' tags or higher population
                validCities.sort((a, b) => {
                  if (a.isCity && !b.isCity) return -1;
                  if (!a.isCity && b.isCity) return 1;
                  return a.distance - b.distance;
                });

                if (validCities.length > 0) {
                  cityName = validCities[0].name;
                }
              }
            }

            // Fallback: If Overpass is busy, query BigDataCloud for State Code and City fallback
            const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
            const geoData = await geoRes.json();

            if (geoData.principalSubdivisionCode) {
              stateCode = geoData.principalSubdivisionCode.replace('US-', '');
            }

            if (!cityName) {
              cityName = geoData.city || "Joliet";
            }

            const locationString = `${cityName}, ${stateCode}`;
            status.innerText = `Updating database to: ${locationString}...`;

            const payload = {
              city: locationString,
              lat: lat,
              lon: lon,
              timestamp: new Date().toISOString()
            };

            const fbRes = await fetch(FIREBASE_URL, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (fbRes.ok) {
              status.innerText = `Success! Location set to: ${locationString}`;
            } else {
              status.innerText = `Firebase Error: ${fbRes.status} ${fbRes.statusText}`;
            }
          } catch (err) {
            status.innerText = "Error: " + err.message;
            console.error(err);
          }
        },
        (err) => { status.innerText = "GPS Permission Error: " + err.message; },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }
  </script>
</body>
</html>
