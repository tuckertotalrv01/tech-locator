<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Location</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 2rem; background: #f9f9f9; }
    button { padding: 1rem 2rem; font-size: 1.2rem; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #status { margin-top: 1.5rem; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h2>Update Technician Location</h2>
  <button onclick="sendLocation()">Update My Location</button>
  <p id="status"></p>

  <script>
    const FIREBASE_URL = "https://tuckertotalrvtechlocator-default-rtdb.firebaseio.com/location.json";

    function sendLocation() {
      const status = document.getElementById("status");
      if (!navigator.geolocation) {
        status.innerText = "Geolocation not supported by browser.";
        return;
      }

      status.innerText = "Acquiring GPS coordinates...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          status.innerText = "Coordinates found. Finding nearest major city...";

          try {
            const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
            const geoData = await geoRes.json();
            
            // Search for primary city in admin hierarchy, skipping townships/minor subdivisions
            let majorCity = geoData.city;

            if (!majorCity && geoData.localityInfo && geoData.localityInfo.administrative) {
              // Look through administrative levels for an incorporated city/place
              const adminList = geoData.localityInfo.administrative;
              const cityLevel = adminList.find(item => item.adminLevel === 8 || item.adminLevel === 7 || item.order === 4);
              if (cityLevel) {
                majorCity = cityLevel.name;
              }
            }

            // Fallback if no specific city level is tagged
            if (!majorCity) {
              majorCity = geoData.locality || geoData.principalSubdivision || "Unknown Area";
            }

            const state = geoData.principalSubdivisionCode ? `, ${geoData.principalSubdivisionCode.replace('US-', '')}` : "";
            const locationString = `${majorCity}${state}`;

            status.innerText = `Updating database to: ${locationString}...`;

            const payload = {
              city: locationString,
              lat: lat,
              lon: lon,
              timestamp: new Date().toISOString()
            };

            const fbRes = await fetch(FIREBASE_URL, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (fbRes.ok) {
              status.innerText = `Success! Location set to: ${locationString}`;
            } else {
              status.innerText = `Firebase Error: ${fbRes.status} ${fbRes.statusText}`;
            }
          } catch (err) {
            status.innerText = "Error: " + err.message;
            console.error(err);
          }
        },
        (err) => { status.innerText = "GPS Permission Error: " + err.message; },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }
  </script>
</body>
</html>
